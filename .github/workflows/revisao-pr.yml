name: Revisão de PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

jobs:
  revisar:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'revisar')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: revisao-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      TITULO: ${{ github.event.pull_request.title }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ARQUIVOS: ${{ github.event.pull_request.changed_files }}
      ADICOES: ${{ github.event.pull_request.additions }}
      REMOCOES: ${{ github.event.pull_request.deletions }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar o contexto
        run: |
          set -euo pipefail
          mkdir -p .revisao
          git diff "$BASE_SHA...$HEAD_SHA" > .revisao/diff.patch
          gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.author.login == "github-actions" and (.body | startswith("## 🔍 Review")))]' \
            > .revisao/reviews.json
          PASSAGEM=$(( $(jq length .revisao/reviews.json) + 1 ))
          jq -r 'last.body // empty' .revisao/reviews.json > .revisao/anterior.md
          cat > .revisao/contexto.md <<EOF
          PR: #$PR
          Título: $TITULO
          Branch: $HEAD_REF
          Base: $BASE_REF
          Commit: ${HEAD_SHA:0:7}
          Passagem: $PASSAGEM
          Arquivos: $ARQUIVOS
          Adições: $ADICOES
          Remoções: $REMOCOES
          EOF

      - name: Revisar com o Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            Você é o revisor de pull requests do projeto SPA Agendamento.

            Leia, nesta ordem:
            1. .github/revisao/regras.md
            2. .github/revisao/formato.md
            3. .revisao/contexto.md
            4. .revisao/diff.patch
            5. .revisao/anterior.md, se não estiver vazio

            Depois leia o que precisar do código para confirmar cada achado.

            Grave o resultado em .revisao/comentario.md, em português do Brasil, seguindo formato.md.
            Esse arquivo é a sua única entrega. Não altere nenhum outro arquivo.

      - name: Publicar o comentário
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s .revisao/comentario.md ]; then
            printf '%s\n' \
              '## ⚠️ Review não executado' \
              '' \
              'O bot não conseguiu gerar o review. Veja o log na aba Actions e, para tentar de novo, coloque a label `revisar`.' \
              > .revisao/comentario.md
          fi
          gh pr comment "$PR" --body-file .revisao/comentario.md

      - name: Remover a label
        if: ${{ !cancelled() && github.event.label.name == 'revisar' }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/revisar"
