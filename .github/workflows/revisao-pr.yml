name: Revisão de PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  revisar:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/revisar') || startsWith(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: revisao-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      BRANCH_PADRAO: ${{ github.event.repository.default_branch }}
      COMENTARIO_ID: ${{ github.event.comment.id }}
    steps:
      - name: Avisar que começou
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        run: gh api -X POST "repos/$GH_REPO/issues/comments/$COMENTARIO_ID/reactions" -f content=eyes

      - name: Baixar o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/pull/${{ env.PR }}/merge
          fetch-depth: 0

      - name: Usar as regras da branch padrão
        if: github.event_name == 'issue_comment'
        run: git checkout "origin/$BRANCH_PADRAO" -- .github/revisao

      - name: Preparar o contexto
        run: |
          set -euo pipefail
          mkdir -p .revisao
          git diff "HEAD^1...HEAD^2" > .revisao/diff.patch
          gh pr view "$PR" --json title,headRefName,baseRefName,changedFiles,additions,deletions,comments > .revisao/pr.json
          jq '[.comments[] | select(.author.login == "github-actions" and (.body | startswith("## 🔍 Review")))]' \
            .revisao/pr.json > .revisao/reviews.json
          jq -r 'last.body // empty' .revisao/reviews.json > .revisao/anterior.md
          {
            jq -r '"Título: \(.title)\nBranch: \(.headRefName)\nBase: \(.baseRefName)\nArquivos: \(.changedFiles)\nAdições: \(.additions)\nRemoções: \(.deletions)"' .revisao/pr.json
            echo "PR: #$PR"
            echo "Commit: $(git rev-parse --short=7 HEAD^2)"
            echo "Passagem: $(( $(jq length .revisao/reviews.json) + 1 ))"
          } > .revisao/contexto.md

      - name: Revisar com o Claude
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            Você é o revisor de pull requests do projeto SPA Agendamento.

            Leia, nesta ordem:
            1. .github/revisao/regras.md
            2. .github/revisao/formato.md
            3. .revisao/contexto.md
            4. .revisao/diff.patch
            5. .revisao/anterior.md, se não estiver vazio

            Depois leia o que precisar do código para confirmar cada achado.

            Antes de gravar, confirme a linha de cada achado com Grep no arquivo real. Os números de linha de .revisao/diff.patch não valem.

            Grave o resultado em .revisao/comentario.md, em português do Brasil, seguindo formato.md.
            Esse arquivo é a sua única entrega. Não altere nenhum outro arquivo.

      - name: Publicar o comentário
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s .revisao/comentario.md ]; then
            printf '%s\n' \
              '## ⚠️ Review não executado' \
              '' \
              'O bot não conseguiu gerar o review. Veja o log na aba Actions e, para tentar de novo, comente `/revisar` no PR.' \
              > .revisao/comentario.md
          fi
          gh pr comment "$PR" --body-file .revisao/comentario.md
